<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<title>Catalogue des cours — UPC</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 2rem; }
		h1 { color: #1a5276; }
		table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
		th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; text-align: left; }
		th { background: #1a5276; color: white; }
		tr:nth-child(even) { background: #f2f2f2; }
		.filtre { color: #555; margin-top: 0.5rem; }
	</style>
</head>
<body>
	<h1>Catalogue des cours</h1>
	<p class="filtre" th:if="${termeRecherche != null and !termeRecherche.isEmpty()}">
		Résultats pour : <strong th:text="${termeRecherche}"></strong>
	</p>
	<p class="filtre" th:if="${termeRecherche == null or termeRecherche.isEmpty()}">
		Tous les cours disponibles
	</p>

	<table>
		<thead>
			<tr>
				<th>Intitulé</th>
				<th>Enseignant</th>
				<th>Salle</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="c : ${listeCours}">
				<td th:text="${c.intitule}"></td>
				<td th:text="${c.enseignant}"></td>
				<td th:text="${c.salle}"></td>
			</tr>
		</tbody>
	</table>
</body>
</html>
